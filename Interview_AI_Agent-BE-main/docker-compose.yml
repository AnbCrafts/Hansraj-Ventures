version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    env_file:
      - ./backend/.env

  ai-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-server
    command: python backend/ai/server.py
    volumes:
      - .:/app
    depends_on:
      - mongo
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
  # ai-agent:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: ai-agent
  #   command: python backend/ai/agent.py dev
  #   volumes:
  #     - .:/app
  #   depends_on:
  #     - mongo

  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-app
    command: python backend/server/app.py
    volumes:
      - .:/app
    depends_on:
      - mongo
    ports:
      - "5055:5055"
    env_file:
      - ./backend/.env

volumes:
  mongo-data: